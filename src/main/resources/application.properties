spring.datasource.url=jdbc:mysql://localhost:3306/hortanaporta?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Opcional: para evitar problemas com timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Tamanho máximo para upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Para desenvolvimento, permita acesso aos arquivos estáticos
spring.web.resources.static-locations=classpath:/static/

# ====================================
# CONFIGURAÇÃO DE EMAIL (GMAIL EXEMPLO)
# ====================================

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu_email@gmail.com
spring.mail.password=sua_senha_app  # Use "App Password" do Google
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Opcional: configurações adicionais
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Para desenvolvimento (não envia realmente)
# spring.mail.test-connection=true

# ==============================
# API BREVO - CONFIGURAÇÃO CORRETA
brevo.api.key=**
brevo.sender.email=hortanaportasender@gmail.com
brevo.sender.name=Horta na Porta

